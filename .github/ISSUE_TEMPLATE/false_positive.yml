name: False positive / false negative
description: A rule fired when it should not have, or missed a risky change.
labels: [rule-accuracy]
body:
  - type: input
    id: rule
    attributes: { label: Rule ID, placeholder: MIG010 }
    validations: { required: true }
  - type: textarea
    id: sql
    attributes: { label: Minimal SQL, render: sql }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why is the result wrong?, description: Include PostgreSQL version and execution context (transaction, runner). }
